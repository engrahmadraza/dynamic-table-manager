<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS FINAL PROJECT</title>
    <link rel="stylesheet" href="/style.css" />
    <!-- <script defer src="./script.js"></script> -->
     <script defer src="./main.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <!-- HTML PART SHOWING ON SCREEN -->
    <div class="htmlpart d-flex justify-content-between container mt-3">
      <h1 class="fw-bold">Table</h1>
      <button
        class="btn btn-white text-warning border-warning px-4"
        data-bs-toggle="modal"
        data-bs-target="#create-table-modal"
      >
        ADD TABLE
      </button>
    </div>

    <!--------------------------------->
    <!-- ADD TABLE MODAL -->
    <div
      class="modal fade"
      id="create-table-modal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-centered ">
        <div class="modal-content">
          <div class="modal-header justify-content-center">
            <h1
              class="modal-title fs-5 fw-bold text-center"
              id="exampleModalLabel"
            >
              ADD TABLE
            </h1>
          </div>
          <div class="modal-body">
            <form id="add-column-form">
              <input
                type="text"
                class="form-control"
                placeholder="TABLE NAME"
                id="add-table-name"
                required
              />
              <!-- Add Columns Btn -->
              <button
                type="button"
                class="btn btn-primary mt-2 d-block mx-auto px-4"
                id="add-column-btn"
              >
                ADD COLUMN
              </button>
            
              <!-- MULTIPLE COLUMNS -->
              <div id="columns-in-modal" class="d-flex flex-column"></div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-success text-white"
              id="createtablebtn"
            >
              CREATE TABLE
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-------------------------------------------->
    <!-- ADD ROW MODAL -->
    <div
      class="modal fade"
      id="addrowmodal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
        <div class="modal-content ">
          <div class="modal-header d-flex justify-content-between">
            <h1 class="modal-title fs-5 fw-bold" id="exampleModalLabel2">
              ADD ROW
            </h1>
            <button class="btn btn-success text-white" id="multiplerowsbtn">
              MULTIPLE ROW
            </button>
          </div>
          <div class="modal-body">
              <form id="addrowsform" class="">
                <div class="" id="rows-in-modal"></div>
            </form>
          </div>
          <div class="modal-footer">
            
            <button type="button" 
            class="btn btn-primary"
            id="create-row"
            >
            CREATE ROW
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-------------------------------------->
    <!-- edit row modal -->
    <div class="modal fade" id="rowEditModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel">EDIT ROW</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="editrowform">
                    
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="saverowedit">EDIT</button>
            </div>
            </div>
        </div>
    </div>
    <!-------------------------------------->
    <!-- surity modal -->
    <div class="modal fade" id="suritymodal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
            <div class="modal-body">
                <p class="pt-3">Are you sure you want to delete <span id="tablenameconfirm"></span> table ???</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" id="deleteTableBtn">YES SURE</button>
            </div>
            </div>
        </div>
    </div>
    <!-------------------------------------->
    <!-- Delete row confirmation modal -->
     <div class="modal fade" id="rowDeleteModal" tabindex="-1" aria-labelledby="rowDeleteModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="rowDeleteModalLabel">Confirm Delete</h1>
            </div>
            <div class="modal-body">
              Are you sure you want to delete this row?
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="button" class="btn btn-danger text-white" id="deleteRowBtn">Delete</button>
            </div>
          </div>
        </div>
      </div>

    <!-------------------------------------->
    <div id="tables" class="w-75 m-auto mt-5"></div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
